
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나주창고재고</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #f3f5f8;
    color: #222;
    font-family: Arial, "Malgun Gothic", sans-serif;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 800;
}

.refresh-btn {
    border: none;
    border-radius: 9px;
    padding: 10px 14px;
    background: #263b59;
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
}

.tab {
    min-height: 43px;
    padding: 9px 4px;
    border: 1px solid #dce1e8;
    border-radius: 9px;
    background: white;
    color: #555;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.tab.active {
    background: #263b59;
    color: white;
    border-color: #263b59;
}

.search-area {
    margin-bottom: 13px;
}

.search-area input {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1px solid #d9dee6;
    border-radius: 10px;
    background: white;
    font-size: 15px;
    outline: none;
}

.search-area input:focus {
    border-color: #526f98;
}

.info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    color: #777;
    font-size: 12px;
}

.list-header {
    display: grid;
    grid-template-columns: 1fr 95px;
    gap: 10px;
    padding: 12px 15px;
    background: #e8edf3;
    border-radius: 9px 9px 0 0;
    color: #47566b;
    font-size: 13px;
    font-weight: bold;
}

.stock-list {
    background: white;
    border-radius: 0 0 10px 10px;
    overflow: hidden;
    border: 1px solid #e7eaf0;
    border-top: none;
}

.stock-item {
    display: grid;
    grid-template-columns: 1fr 95px;
    gap: 10px;
    align-items: center;
    min-height: 53px;
    padding: 11px 15px;
    border-bottom: 1px solid #edf0f4;
}

.stock-item:last-child {
    border-bottom: none;
}

.product-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
}

.quantity {
    text-align: right;
    font-size: 16px;
    font-weight: 800;
    color: #263b59;
}

.empty {
    padding: 45px 15px;
    text-align: center;
    color: #999;
    font-size: 14px;
    background: white;
}

.status {
    margin-top: 14px;
    text-align: center;
    color: #888;
    font-size: 11px;
}

.loading {
    padding: 45px 15px;
    text-align: center;
    color: #777;
    background: white;
}

@media (max-width: 480px) {
    body {
        padding: 11px;
    }

    .header h1 {
        font-size: 22px;
    }

    .tab {
        font-size: 13px;
        min-height: 42px;
    }

    .stock-item {
        padding: 12px;
    }

    .product-name {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>나주창고재고</h1>
        <button class="refresh-btn" onclick="loadCurrentSheet()">
            ↻ 새로고침
        </button>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="search-area">
        <input
            type="text"
            id="searchInput"
            placeholder="상품명을 검색하세요."
            oninput="renderStock()"
        >
    </div>

    <div class="info-row">
        <span id="selectedSupplier">3M 재고</span>
        <span id="lastUpdated">데이터 확인 중</span>
    </div>

    <div class="list-header">
        <span>상품명</span>
        <span style="text-align:right;">재고 수량</span>
    </div>

    <div class="stock-list" id="stockList">
        <div class="loading">재고 데이터를 불러오는 중입니다.</div>
    </div>

    <div class="status" id="statusMessage">
        구글 스프레드시트 연결 중...
    </div>

</div>

<script>

const SPREADSHEET_ID =
    "168qV0AZ9hCTgU15EStP3UDo4fBTxuPeU";

const SUPPLIERS = [
    "3M",
    "짐모아",
    "스테들러",
    "유니",
    "파이롯트",
    "항소",
    "톰보",
    "화이트 프린텍"
];

let currentSupplier = "3M";

let stockData = {};

let isLoading = false;

let lastUpdateTime = null;


// 초기 실행
function init() {

    SUPPLIERS.forEach(name => {
        stockData[name] = [];
    });

    createTabs();

    loadCurrentSheet();

    setInterval(() => {
        loadCurrentSheet(true);
    }, 60000);

}


// 매입사 탭 생성
function createTabs() {

    const tabs = document.getElementById("tabs");

    tabs.innerHTML = "";

    SUPPLIERS.forEach(name => {

        const button = document.createElement("button");

        button.className =
            "tab" + (name === currentSupplier ? " active" : "");

        button.textContent = name;

        button.onclick = () => selectSupplier(name);

        tabs.appendChild(button);

    });

}


// 매입사 선택
function selectSupplier(name) {

    currentSupplier = name;

    document.getElementById("searchInput").value = "";

    createTabs();

    document.getElementById("selectedSupplier").textContent =
        name + " 재고";

    if (stockData[name].length > 0) {
        renderStock();
        loadCurrentSheet(true);
    } else {
        loadCurrentSheet();
    }

}


// 현재 선택된 시트 불러오기
function loadCurrentSheet(silent = false) {

    if (isLoading) return;

    isLoading = true;

    const supplier = currentSupplier;

    const stockList = document.getElementById("stockList");

    if (!silent) {
        stockList.innerHTML =
            '<div class="loading">재고 데이터를 불러오는 중입니다.</div>';
    }

    document.getElementById("statusMessage").textContent =
        "데이터 연결 중...";

    const callbackName =
        "stockCallback_" + Date.now() + "_" +
        Math.floor(Math.random() * 100000);

    const url =
        "https://docs.google.com/spreadsheets/d/" +
        SPREADSHEET_ID +
        "/gviz/tq?sheet=" +
        encodeURIComponent(supplier) +
        "&tqx=out:json;responseHandler=" +
        callbackName;

    const script = document.createElement("script");

    let finished = false;

    const timeout = setTimeout(() => {
        finishError("응답 시간이 초과되었습니다.");
    }, 20000);

    function cleanup() {

        if (finished) return;

        finished = true;

        clearTimeout(timeout);

        script.remove();

        delete window[callbackName];

        isLoading = false;

    }

    function finishError(message) {

        cleanup();

        document.getElementById("statusMessage").textContent =
            message + " 시트 공개 권한을 확인해주세요.";

        if (stockData[supplier].length === 0) {
            stockList.innerHTML =
                '<div class="empty">데이터를 불러오지 못했습니다.<br>' +
                '스프레드시트 공유 설정을 확인해주세요.</div>';
        }

    }

    window[callbackName] = function(response) {

        if (finished) return;

        try {

            if (!response || !response.table) {
                throw new Error("시트 응답이 올바르지 않습니다.");
            }

            const rows = response.table.rows || [];

            const result = [];

            rows.forEach(row => {

                const cells = row.c || [];

                const supplierValue = getCellValue(cells[0]);
                const productName = getCellValue(cells[1]);
                const quantityValue = getCellValue(cells[2]);

                if (
                    productName === "" ||
                    productName === null ||
                    productName === undefined
                ) {
                    return;
                }

                result.push({
                    supplier: supplierValue || supplier,
                    name: String(productName).trim(),
                    quantity: quantityValue
                });

            });

            stockData[supplier] = result;

            lastUpdateTime = new Date();

            cleanup();

            renderStock();

            document.getElementById("lastUpdated").textContent =
                "갱신 " + formatTime(lastUpdateTime);

            document.getElementById("statusMessage").textContent =
                "정상적으로 연결되었습니다. (60초마다 자동 갱신)";

        } catch (error) {

            finishError("데이터 처리 오류");

            console.error(error);

        }

    };

    script.onerror = () => {
        finishError("구글 시트 연결에 실패했습니다.");
    };

    script.src = url;

    document.head.appendChild(script);

}


// 셀 값 추출
function getCellValue(cell) {

    if (!cell) return "";

    if (cell.f !== null && cell.f !== undefined) {
        return cell.f;
    }

    return cell.v ?? "";

}


// 재고 화면 표시
function renderStock() {

    const stockList = document.getElementById("stockList");

    const searchValue =
        document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const data = stockData[currentSupplier] || [];

    const filtered = data.filter(item => {

        return item.name.toLowerCase().includes(searchValue);

    });

    if (filtered.length === 0) {

        stockList.innerHTML =
            '<div class="empty">' +
            (data.length === 0
                ? "등록된 재고가 없습니다."
                : "검색 결과가 없습니다.") +
            '</div>';

        return;

    }

    stockList.innerHTML = "";

    filtered.forEach(item => {

        const row = document.createElement("div");

        row.className = "stock-item";

        const name = document.createElement("div");

        name.className = "product-name";

        name.textContent = item.name;

        const quantity = document.createElement("div");

        quantity.className = "quantity";

        quantity.textContent =
            formatQuantity(item.quantity);

        row.appendChild(name);

        row.appendChild(quantity);

        stockList.appendChild(row);

    });

}


// 수량 표시
function formatQuantity(value) {

    if (value === null || value === undefined || value === "") {
        return "-";
    }

    const number = Number(
        String(value).replace(/,/g, "").trim()
    );

    if (Number.isFinite(number)) {
        return number.toLocaleString("ko-KR");
    }

    return String(value);

}


// 시간 표시
function formatTime(date) {

    return date.toLocaleTimeString("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

}


// 시작
init();

</script>

</body>
</html>
