
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나주창고재고</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #f3f5f8;
    color: #222;
    font-family: Arial, "Malgun Gothic", sans-serif;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 800;
}

.refresh-btn {
    border: none;
    border-radius: 9px;
    padding: 10px 14px;
    background: #263b59;
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.refresh-btn:disabled {
    opacity: .6;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
}

.tab {
    min-height: 43px;
    padding: 9px 4px;
    border: 1px solid #dce1e8;
    border-radius: 9px;
    background: white;
    color: #555;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.tab.active {
    background: #263b59;
    color: white;
    border-color: #263b59;
}

.search-area {
    margin-bottom: 13px;
}

.search-area input {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1px solid #d9dee6;
    border-radius: 10px;
    background: white;
    font-size: 15px;
    outline: none;
}

.search-area input:focus {
    border-color: #526f98;
}

.info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    color: #777;
    font-size: 12px;
    gap: 8px;
}

.list-header {
    display: grid;
    grid-template-columns: 1fr 95px;
    gap: 10px;
    padding: 12px 15px;
    background: #e8edf3;
    border-radius: 9px 9px 0 0;
    color: #47566b;
    font-size: 13px;
    font-weight: bold;
}

.stock-list {
    background: white;
    border-radius: 0 0 10px 10px;
    overflow: hidden;
    border: 1px solid #e7eaf0;
    border-top: none;
}

.stock-item {
    display: grid;
    grid-template-columns: 1fr 95px;
    gap: 10px;
    align-items: center;
    min-height: 53px;
    padding: 11px 15px;
    border-bottom: 1px solid #edf0f4;
}

.stock-item:last-child {
    border-bottom: none;
}

.product-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
}

.quantity {
    text-align: right;
    font-size: 16px;
    font-weight: 800;
    color: #263b59;
}

.empty {
    padding: 45px 15px;
    text-align: center;
    color: #999;
    font-size: 14px;
    background: white;
}

.status {
    margin-top: 14px;
    text-align: center;
    color: #888;
    font-size: 11px;
    word-break: break-word;
}

.loading {
    padding: 45px 15px;
    text-align: center;
    color: #777;
    background: white;
}

@media (max-width: 480px) {
    body {
        padding: 11px;
    }

    .header h1 {
        font-size: 22px;
    }

    .tab {
        font-size: 13px;
        min-height: 42px;
    }

    .stock-item {
        padding: 12px;
    }

    .product-name {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>나주창고재고</h1>
        <button class="refresh-btn" id="refreshBtn"
                onclick="loadCurrentSheet()">
            ↻ 새로고침
        </button>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="search-area">
        <input
            type="text"
            id="searchInput"
            placeholder="상품명을 검색하세요."
            oninput="renderStock()"
        >
    </div>

    <div class="info-row">
        <span id="selectedSupplier">3M 재고</span>
        <span id="lastUpdated">데이터 확인 중</span>
    </div>

    <div class="list-header">
        <span>상품명</span>
        <span style="text-align:right;">재고 수량</span>
    </div>

    <div class="stock-list" id="stockList">
        <div class="loading">재고 데이터를 불러오는 중입니다.</div>
    </div>

    <div class="status" id="statusMessage">
        구글 스프레드시트 연결 중...
    </div>

</div>

<script>
"use strict";

const SPREADSHEET_ID =
    "168qV0AZ9hCTgU15EStP3UDo4fBTxuPeU";

const SUPPLIERS = [
    "3M",
    "짐모아",
    "스테들러",
    "유니",
    "파이롯트",
    "항소",
    "톰보",
    "화이트 프린텍"
];

let currentSupplier = "3M";

let stockData = {};

let loadingState = {};

let lastUpdate = {};

let requestTimers = {};

let requestScripts = {};

let requestSequence = 0;


// 초기 실행
function init() {

    SUPPLIERS.forEach(name => {
        stockData[name] = [];
        loadingState[name] = false;
        lastUpdate[name] = null;
    });

    createTabs();

    loadCurrentSheet();

    // 60초 자동 갱신
    setInterval(() => {
        SUPPLIERS.forEach(name => {
            loadSheet(name, true);
        });
    }, 60000);

}


// 매입사 탭 생성
function createTabs() {

    const tabs = document.getElementById("tabs");

    tabs.innerHTML = "";

    SUPPLIERS.forEach(name => {

        const button = document.createElement("button");

        button.className =
            "tab" + (name === currentSupplier ? " active" : "");

        button.textContent = name;

        button.onclick = () => selectSupplier(name);

        tabs.appendChild(button);

    });

}


// 매입사 선택
function selectSupplier(name) {

    currentSupplier = name;

    document.getElementById("searchInput").value = "";

    document.getElementById("selectedSupplier").textContent =
        name + " 재고";

    createTabs();

    renderStock();

    if (
        stockData[name].length === 0 ||
        !lastUpdate[name]
    ) {
        loadSheet(name);
    } else {
        updateLastUpdated();
        loadSheet(name, true);
    }

}


// 현재 선택된 시트 새로고침
function loadCurrentSheet() {

    loadSheet(currentSupplier);

}


// 시트별 데이터 요청
function loadSheet(supplier, silent = false) {

    // 같은 시트의 중복 요청 방지
    if (loadingState[supplier]) return;

    loadingState[supplier] = true;

    const requestId = ++requestSequence;

    const stockList = document.getElementById("stockList");

    if (supplier === currentSupplier) {

        if (!silent) {
            stockList.innerHTML =
                '<div class="loading">재고 데이터를 불러오는 중입니다.</div>';
        }

        document.getElementById("statusMessage").textContent =
            supplier + " 데이터 연결 중...";

        document.getElementById("refreshBtn").disabled = true;
    }

    // Google Visualization JSONP 주소
    const url =
        "https://docs.google.com/spreadsheets/d/" +
        SPREADSHEET_ID +
        "/gviz/tq?sheet=" +
        encodeURIComponent(supplier) +
        "&tqx=" +
        encodeURIComponent("out:json") +
        "&_=" + Date.now();

    const callbackName =
        "googleVisualizationCallback_" +
        requestId + "_" +
        Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    script.async = true;

    let finished = false;

    let timeout;

    function cleanup() {

        if (finished) return;

        finished = true;

        clearTimeout(timeout);

        script.remove();

        delete window[callbackName];

        loadingState[supplier] = false;

        if (supplier === currentSupplier) {
            document.getElementById("refreshBtn").disabled = false;
        }

    }

    function finishError(message) {

        if (finished) return;

        cleanup();

        console.error(
            supplier + " 시트 오류:",
            message
        );

        if (supplier !== currentSupplier) return;

        document.getElementById("statusMessage").textContent =
            supplier + ": " + message;

        if (stockData[supplier].length === 0) {

            stockList.innerHTML =
                '<div class="empty">' +
                '데이터를 불러오지 못했습니다.<br>' +
                '오류: ' + escapeHTML(message) +
                '</div>';

        } else {

            renderStock();

        }

    }

    window[callbackName] = function(response) {

        if (finished) return;

        try {

            if (!response) {
                throw new Error("응답 데이터가 없습니다.");
            }

            if (response.status === "error") {
                throw new Error(
                    response.errors?.[0]?.detailed_message ||
                    response.errors?.[0]?.message ||
                    "구글 시트 응답 오류"
                );
            }

            if (!response.table) {
                throw new Error(
                    "Google Visualization 테이블을 찾을 수 없습니다."
                );
            }

            const rows = response.table.rows || [];

            const result = [];

            rows.forEach(row => {

                const cells = row.c || [];

                const supplierValue =
                    getCellValue(cells[0]);

                const productName =
                    getCellValue(cells[1]);

                const quantityValue =
                    getCellValue(cells[2]);

                if (
                    productName === null ||
                    productName === undefined ||
                    String(productName).trim() === ""
                ) {
                    return;
                }

                result.push({

                    supplier: supplierValue || supplier,

                    name: String(productName).trim(),

                    quantity: quantityValue

                });

            });

            stockData[supplier] = result;

            lastUpdate[supplier] = new Date();

            cleanup();

            if (supplier === currentSupplier) {

                renderStock();

                updateLastUpdated();

                document.getElementById("statusMessage").textContent =
                    "정상적으로 연결되었습니다. (60초마다 자동 갱신)";

            }

        } catch (error) {

            finishError(
                error.message || "데이터 처리 오류"
            );

        }

    };

    script.onerror = function() {

        finishError(
            "구글 시트 연결에 실패했습니다."
        );

    };

    timeout = setTimeout(() => {

        finishError(
            "응답 시간이 초과되었습니다."
        );

    }, 20000);

    script.src = url;

    requestScripts[supplier] = script;

    document.head.appendChild(script);

}


// 셀 값 추출
// 원본값 v를 우선 사용하고 없으면 표시값 f 사용
function getCellValue(cell) {

    if (!cell) return "";

    if (
        cell.v !== null &&
        cell.v !== undefined
    ) {
        return cell.v;
    }

    if (
        cell.f !== null &&
        cell.f !== undefined
    ) {
        return cell.f;
    }

    return "";

}


// 재고 화면 표시
function renderStock() {

    const stockList = document.getElementById("stockList");

    const searchValue =
        document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const data = stockData[currentSupplier] || [];

    const filtered = data.filter(item => {

        return item.name.toLowerCase().includes(searchValue);

    });

    if (filtered.length === 0) {

        stockList.innerHTML =
            '<div class="empty">' +
            (data.length === 0
                ? "등록된 재고가 없습니다."
                : "검색 결과가 없습니다.") +
            '</div>';

        return;

    }

    stockList.innerHTML = "";

    filtered.forEach(item => {

        const row = document.createElement("div");

        row.className = "stock-item";

        const name = document.createElement("div");

        name.className = "product-name";

        name.textContent = item.name;

        const quantity = document.createElement("div");

        quantity.className = "quantity";

        quantity.textContent =
            formatQuantity(item.quantity);

        row.appendChild(name);

        row.appendChild(quantity);

        stockList.appendChild(row);

    });

}


// 수량 표시
function formatQuantity(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "-";
    }

    const number = Number(
        String(value).replace(/,/g, "").trim()
    );

    if (Number.isFinite(number)) {
        return number.toLocaleString("ko-KR");
    }

    return String(value);

}


// 마지막 갱신 시간 표시
function updateLastUpdated() {

    const date = lastUpdate[currentSupplier];

    document.getElementById("lastUpdated").textContent =
        date
            ? "갱신 " + formatTime(date)
            : "데이터 확인 중";

}


// 시간 표시
function formatTime(date) {

    return date.toLocaleTimeString("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

}


// 오류 메시지 HTML 보호
function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => {

        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];

    });

}


// 시작
init();

</script>

</body>
</html>
